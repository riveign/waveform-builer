name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # --extra dev, not analysis: essentia/librosa/tensorflow are hundreds of
      # megabytes and no test imports them (they are lazy-loaded inside
      # functions). See docs/notes/OBS-007.
      - name: Install
        run: uv sync --extra dev --frozen

      - name: Lint
        run: uv run ruff check src/ tests/ alembic/

      - name: Format
        run: uv run ruff format --check src/ tests/ alembic/

      # Runs tests/test_migrations.py among the rest: the chain must build the
      # schema from base, and must not have drifted from the ORM. That check is
      # the reason CI is possible at all — see docs/notes/CLM-004.
      - name: Test
        run: uv run pytest -q

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The API-contract check regenerates the schema from the FastAPI app, so this
      # job needs the backend installed too.
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install backend (for schema generation)
        run: uv sync --extra api --frozen
        working-directory: .

      - name: Install
        run: npm ci

      # Regenerates the client types from the live FastAPI schema and fails if the
      # committed output has drifted. This is what makes a renamed Pydantic field a
      # red build rather than undefined at runtime (docs/notes/OBS-005/K4).
      - name: API types are current
        run: npm run check:api

      - name: Type-check
        run: npx svelte-check --tsconfig ./tsconfig.json

      - name: Build
        run: npx vite build
